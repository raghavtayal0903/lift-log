<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiftLog</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Auth View -->
  <main id="authSection" class="auth-container">
    <div class="card auth-card">
      <h1 class="brand-title">LiftLog</h1>
      <p class="subtitle">Sign in to keep your workout logs private and synced.</p>

      <form id="authForm" class="stack">
        <div class="field">
          <label for="authEmail">Email</label>
          <input type="email" id="authEmail" placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" placeholder="••••••••" minlength="6" required />
        </div>

        <p id="authError" class="error-text hidden"></p>

        <button type="submit" id="authSubmitBtn" class="btn btn-primary">Sign In</button>
      </form>

      <div class="divider"><span>or</span></div>

      <button type="button" id="googleSignInBtn" class="btn btn-secondary">
        Continue with Google
      </button>

      <p class="auth-switch">
        <span id="authModePrompt">Don't have an account?</span>
        <button type="button" id="toggleAuthModeBtn" class="link-btn">Create Account</button>
      </p>
    </div>
  </main>

  <!-- Main App View -->
  <div id="appSection" class="app-container hidden">
    <header class="app-header">
      <div>
        <h1 class="brand-title">LiftLog</h1>
        <p id="userEmailDisplay" class="user-email"></p>
      </div>
      <button type="button" id="signOutBtn" class="btn btn-outline">Sign Out</button>
    </header>

    <!-- Log Exercise Form -->
    <section class="card">
      <h2>Log Exercise</h2>
      <form id="workoutForm" class="stack">
        <div class="grid-2">
          <div class="field">
            <label for="workoutDate">Date</label>
            <input type="date" id="workoutDate" required />
          </div>
          <div class="field">
            <label for="exerciseName">Exercise</label>
            <input type="text" id="exerciseName" placeholder="e.g., Bench Press" required />
          </div>
        </div>

        <div class="sets-section">
          <div class="sets-header">
            <label>Sets</label>
            <button type="button" id="addMainSetBtn" class="btn btn-small btn-secondary">+ Add Set</button>
          </div>
          <div id="mainSetsContainer" class="sets-list"></div>
        </div>

        <div class="field">
          <label for="workoutNotes">Notes (optional)</label>
          <input type="text" id="workoutNotes" placeholder="e.g., Felt strong, slow eccentric" />
        </div>

        <button type="submit" class="btn btn-primary">Save Exercise</button>
      </form>
    </section>

    <!-- Workout History Grouped by Day -->
    <section class="history-section">
      <h2>Workout History</h2>
      <div id="emptyState" class="card empty-state hidden">
        No workouts logged yet. Add your first exercise above.
      </div>
      <div id="workoutsList" class="days-list"></div>
    </section>
  </div>

  <!-- Inline Add Exercise to Existing Day Modal -->
  <div id="inlineAddModal" class="modal hidden">
    <div class="card modal-card">
      <div class="modal-header">
        <h2>Add Exercise — <span id="inlineDateDisplay"></span></h2>
        <button type="button" id="closeInlineModalBtn" class="icon-btn" aria-label="Close">&times;</button>
      </div>
      <form id="inlineAddForm" class="stack">
        <input type="hidden" id="inlineDateInput" />
        <div class="field">
          <label for="inlineExerciseName">Exercise</label>
          <input type="text" id="inlineExerciseName" placeholder="e.g., Incline Dumbbell Press" required />
        </div>

        <div class="sets-section">
          <div class="sets-header">
            <label>Sets</label>
            <button type="button" id="addInlineSetBtn" class="btn btn-small btn-secondary">+ Add Set</button>
          </div>
          <div id="inlineSetsContainer" class="sets-list"></div>
        </div>

        <div class="field">
          <label for="inlineNotes">Notes (optional)</label>
          <input type="text" id="inlineNotes" placeholder="Optional notes" />
        </div>

        <button type="submit" class="btn btn-primary">Add to Day</button>
      </form>
    </div>
  </div>

  <!-- Edit Exercise Modal -->
  <div id="editModal" class="modal hidden">
    <div class="card modal-card">
      <div class="modal-header">
        <h2>Edit Exercise</h2>
        <button type="button" id="closeEditModalBtn" class="icon-btn" aria-label="Close">&times;</button>
      </div>
      <form id="editForm" class="stack">
        <input type="hidden" id="editWorkoutId" />
        <div class="grid-2">
          <div class="field">
            <label for="editDate">Date</label>
            <input type="date" id="editDate" required />
          </div>
          <div class="field">
            <label for="editExerciseName">Exercise</label>
            <input type="text" id="editExerciseName" required />
          </div>
        </div>

        <div class="sets-section">
          <div class="sets-header">
            <label>Sets</label>
            <button type="button" id="addEditSetBtn" class="btn btn-small btn-secondary">+ Add Set</button>
          </div>
          <div id="editSetsContainer" class="sets-list"></div>
        </div>

        <div class="field">
          <label for="editNotes">Notes (optional)</label>
          <input type="text" id="editNotes" />
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
